<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D Модель</title>
    <script src="{% static 'threejs/three.min.js' %}"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        let scene, camera, renderer, mesh, raycaster, mouse;

        init();
        animate();

        function init() {
            // Контейнер
            const container = document.getElementById('container');

            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // Камера
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            // Mesh (куб)
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0, 0);
            scene.add(mesh);

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Обработчик кликов
            container.addEventListener('click', onCanvasClick, false);

            // Обработчик изменения размера окна
            window.addEventListener('resize', onWindowResize, false);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Вращение mesh
            mesh.rotation.y += 0.005;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onCanvasClick(event) {
            // Нормализация координат мыши
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            // Обновление raycaster
            raycaster.setFromCamera(mouse, camera);

            // Проверка пересечений
            const intersects = raycaster.intersectObject(mesh);

            if (intersects.length > 0) {
                console.log('Клик по mesh!');
                // Изменение цвета при клике
                mesh.material.color.set(0xff0000);
                setTimeout(() => {
                    mesh.material.color.set(0x00ff00);
                }, 200);
            } else {
                console.log('Клик вне mesh');
            }
        }
    </script>
</body>
</html>
